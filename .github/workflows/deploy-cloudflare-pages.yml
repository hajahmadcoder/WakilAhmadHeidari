name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy-cloudflare-pages.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy site/ to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9a1437a19e0de355cf3bc816f31723e5
          command: pages deploy site --project-name=wakilahmadheidari --branch=main --commit-dirty=true
